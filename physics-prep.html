<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Year 9 Physics Exam Prep</title>
<style>
  :root {
    --primary: #1a73e8;
    --success: #1e8e3e;
    --danger: #d93025;
    --warn: #e37400;
    --bg: #f8f9fa;
    --card: #ffffff;
    --border: #dadce0;
    --text: #202124;
    --muted: #5f6368;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    background: linear-gradient(135deg, #1a237e, #1a73e8);
    color: white;
    padding: 1.5rem 2rem;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 1rem;
    box-shadow: 0 2px 8px rgba(0,0,0,.2);
  }
  header h1 { font-size: 1.5rem; font-weight: 700; }
  header p { font-size: .9rem; opacity: .85; }
  #score-bar {
    display: flex; gap: 1.5rem; align-items: center;
    background: rgba(255,255,255,.15);
    border-radius: 8px; padding: .5rem 1rem;
    font-size: .9rem;
  }
  #score-bar span { font-weight: 700; font-size: 1.1rem; }
  .green { color: #81c995; }
  .red   { color: #f28b82; }

  main { max-width: 820px; margin: 2rem auto; padding: 0 1rem; }

  /* Topic selector */
  #topic-screen { text-align: center; }
  #topic-screen h2 { font-size: 1.4rem; margin-bottom: 1.5rem; color: var(--primary); }
  .topic-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1rem; margin-bottom: 2rem;
  }
  .topic-card {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 1.2rem;
    cursor: pointer;
    transition: all .2s;
    text-align: left;
  }
  .topic-card:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(26,115,232,.15); }
  .topic-card.selected { border-color: var(--primary); background: #e8f0fe; }
  .topic-card .icon { font-size: 2rem; margin-bottom: .5rem; }
  .topic-card h3 { font-size: 1rem; color: var(--text); }
  .topic-card p  { font-size: .8rem; color: var(--muted); margin-top: .3rem; }
  #start-btn {
    background: var(--primary); color: white;
    border: none; border-radius: 8px;
    padding: .85rem 2.5rem; font-size: 1rem; font-weight: 600;
    cursor: pointer; transition: background .2s;
  }
  #start-btn:hover { background: #1557b0; }
  #start-btn:disabled { background: #aaa; cursor: default; }

  /* Question card */
  #quiz-screen { display: none; }
  .progress-row {
    display: flex; align-items: center; gap: 1rem;
    margin-bottom: 1.5rem;
  }
  .progress-bar-wrap {
    flex: 1; background: var(--border);
    border-radius: 99px; height: 8px; overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%; background: var(--primary);
    border-radius: 99px; transition: width .4s;
  }
  .progress-label { font-size: .85rem; color: var(--muted); white-space: nowrap; }

  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 2rem;
    box-shadow: 0 1px 6px rgba(0,0,0,.1);
    margin-bottom: 1.5rem;
  }
  .q-meta {
    display: flex; gap: .6rem; align-items: center;
    margin-bottom: 1rem;
  }
  .badge {
    font-size: .75rem; font-weight: 700; padding: .25rem .65rem;
    border-radius: 99px; text-transform: uppercase; letter-spacing: .04em;
  }
  .badge-mc   { background: #e8f0fe; color: #1a73e8; }
  .badge-sa   { background: #fce8e6; color: #c5221f; }
  .badge-calc { background: #e6f4ea; color: #137333; }
  .badge-tf   { background: #fef7e0; color: #b06000; }
  .badge-chal { background: #f3e8fd; color: #7b1fa2; }
  .topic-tag  { font-size: .8rem; color: var(--muted); }

  .q-text { font-size: 1.15rem; font-weight: 600; line-height: 1.5; margin-bottom: 1.5rem; }

  /* Formula hint */
  .formula-hint {
    background: #f0f4ff; border-left: 4px solid var(--primary);
    border-radius: 0 8px 8px 0;
    padding: .7rem 1rem; margin-bottom: 1.2rem;
    font-size: .9rem; color: #1a237e;
  }
  .formula-hint strong { display: block; margin-bottom: .2rem; font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: var(--primary); }

  /* MC options */
  .options { display: flex; flex-direction: column; gap: .7rem; }
  .option-btn {
    display: flex; align-items: center; gap: .8rem;
    background: var(--bg); border: 2px solid var(--border);
    border-radius: 10px; padding: .85rem 1rem;
    font-size: 1rem; cursor: pointer; text-align: left;
    transition: all .2s; width: 100%;
  }
  .option-btn .opt-letter {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--border); display: flex; align-items: center;
    justify-content: center; font-weight: 700; font-size: .85rem;
    flex-shrink: 0; transition: all .2s;
  }
  .option-btn:hover:not(:disabled) { border-color: var(--primary); background: #e8f0fe; }
  .option-btn:hover:not(:disabled) .opt-letter { background: var(--primary); color: white; }
  .option-btn.correct { border-color: var(--success); background: #e6f4ea; }
  .option-btn.correct .opt-letter { background: var(--success); color: white; }
  .option-btn.wrong   { border-color: var(--danger);  background: #fce8e6; }
  .option-btn.wrong   .opt-letter { background: var(--danger);  color: white; }
  .option-btn:disabled { cursor: default; }

  /* T/F */
  .tf-row { display: flex; gap: 1rem; }
  .tf-btn {
    flex: 1; padding: .9rem; font-size: 1rem; font-weight: 700;
    border: 2px solid var(--border); border-radius: 10px;
    background: var(--bg); cursor: pointer; transition: all .2s;
  }
  .tf-btn:hover:not(:disabled) { border-color: var(--primary); background: #e8f0fe; }
  .tf-btn.correct { border-color: var(--success); background: #e6f4ea; color: var(--success); }
  .tf-btn.wrong   { border-color: var(--danger);  background: #fce8e6; color: var(--danger);  }
  .tf-btn:disabled { cursor: default; }

  /* Text input */
  .text-input-wrap { display: flex; flex-direction: column; gap: .8rem; }
  .answer-input {
    width: 100%; border: 2px solid var(--border); border-radius: 10px;
    padding: .85rem 1rem; font-size: 1rem; font-family: inherit;
    resize: vertical; min-height: 80px;
    transition: border-color .2s;
  }
  .answer-input:focus { outline: none; border-color: var(--primary); }
  .submit-btn {
    background: var(--primary); color: white; border: none;
    border-radius: 8px; padding: .75rem 1.8rem;
    font-size: 1rem; font-weight: 600; cursor: pointer;
    align-self: flex-start; transition: background .2s;
  }
  .submit-btn:hover { background: #1557b0; }

  /* Calc input */
  .calc-input { max-width: 280px; min-height: unset; height: 48px; resize: none; }

  /* Feedback */
  .feedback {
    margin-top: 1.2rem; border-radius: 10px; padding: 1.2rem;
    animation: fadeIn .3s ease;
  }
  @keyframes fadeIn { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform: none; } }
  .feedback.correct-fb { background: #e6f4ea; border: 1px solid #81c995; }
  .feedback.wrong-fb   { background: #fce8e6; border: 1px solid #f28b82; }
  .feedback-title { font-weight: 700; font-size: 1rem; margin-bottom: .5rem; }
  .feedback.correct-fb .feedback-title { color: var(--success); }
  .feedback.wrong-fb   .feedback-title { color: var(--danger);  }
  .feedback p { font-size: .95rem; line-height: 1.6; }
  .walkthrough {
    margin-top: 1rem; background: #fff3e0; border: 1px solid #ffcc80;
    border-radius: 8px; padding: 1rem;
  }
  .walkthrough strong { color: var(--warn); font-size: .85rem; text-transform: uppercase; letter-spacing: .05em; }
  .walkthrough ol { margin-top: .5rem; padding-left: 1.3rem; }
  .walkthrough ol li { font-size: .93rem; line-height: 1.6; margin-bottom: .3rem; }

  /* Next button */
  .next-btn {
    background: var(--primary); color: white; border: none;
    border-radius: 8px; padding: .75rem 2rem;
    font-size: 1rem; font-weight: 600; cursor: pointer;
    margin-top: 1rem; transition: background .2s; display: block;
  }
  .next-btn:hover { background: #1557b0; }
  .similar-label {
    margin-top: 1.2rem; padding: .6rem 1rem;
    background: #fff8e1; border-radius: 8px;
    font-size: .88rem; color: var(--warn); font-weight: 600;
    border: 1px dashed #ffcc02;
  }

  /* Results */
  #results-screen { display: none; text-align: center; }
  .results-card {
    background: var(--card); border-radius: 16px;
    padding: 2.5rem 2rem; box-shadow: 0 2px 12px rgba(0,0,0,.1);
  }
  .results-card h2 { font-size: 1.8rem; margin-bottom: .5rem; }
  .big-score { font-size: 4rem; font-weight: 800; color: var(--primary); }
  .big-score sub { font-size: 2rem; color: var(--muted); }
  .results-breakdown {
    display: flex; justify-content: center; gap: 2rem;
    margin: 1.5rem 0; flex-wrap: wrap;
  }
  .rb-item { text-align: center; }
  .rb-item .rb-num { font-size: 2rem; font-weight: 700; }
  .rb-item .rb-lbl { font-size: .85rem; color: var(--muted); }
  .rb-item.rb-correct .rb-num { color: var(--success); }
  .rb-item.rb-wrong   .rb-num { color: var(--danger); }
  .restart-btn {
    background: var(--primary); color: white; border: none;
    border-radius: 8px; padding: .85rem 2.5rem;
    font-size: 1rem; font-weight: 600; cursor: pointer;
    transition: background .2s; margin-top: 1rem;
  }
  .restart-btn:hover { background: #1557b0; }

  @media (max-width: 600px) {
    header { padding: 1rem; }
    .card { padding: 1.3rem; }
    .q-text { font-size: 1rem; }
    .big-score { font-size: 3rem; }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>Year 9 Physics Exam Prep</h1>
    <p>MYP 4 — Electric Force, Circuits, Energy, Oscillations &amp; Waves</p>
  </div>
  <div id="score-bar">
    <div>Correct <span class="green" id="hdr-correct">0</span></div>
    <div>Wrong <span class="red" id="hdr-wrong">0</span></div>
    <div>Q <span id="hdr-qnum">0</span></div>
  </div>
</header>

<main>
  <!-- TOPIC SELECTION -->
  <div id="topic-screen">
    <h2>Choose topics to practise</h2>
    <div class="topic-grid" id="topic-grid"></div>
    <button id="start-btn" disabled onclick="startQuiz()">Start Practice</button>
  </div>

  <!-- QUIZ -->
  <div id="quiz-screen">
    <div class="progress-row">
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
      </div>
      <span class="progress-label" id="progress-label">0 / 0</span>
    </div>
    <div id="question-area"></div>
  </div>

  <!-- RESULTS -->
  <div id="results-screen">
    <div class="results-card">
      <h2>Session Complete!</h2>
      <div class="big-score"><span id="res-score">0</span><sub> / <span id="res-total">0</span></sub></div>
      <div class="results-breakdown">
        <div class="rb-item rb-correct"><div class="rb-num" id="res-correct">0</div><div class="rb-lbl">Correct</div></div>
        <div class="rb-item rb-wrong"><div class="rb-num" id="res-wrong">0</div><div class="rb-lbl">Wrong</div></div>
        <div class="rb-item"><div class="rb-num" id="res-pct">0%</div><div class="rb-lbl">Score</div></div>
      </div>
      <p id="res-message" style="color:var(--muted);margin-bottom:1.2rem;"></p>
      <button class="restart-btn" onclick="location.reload()">Try Again</button>
    </div>
  </div>
</main>

<script>
// ─── QUESTION BANK ────────────────────────────────────────────────────────────
const TOPICS = [
  { id:'coulomb',  label:"Coulomb's Law",       icon:'⚡', desc:'Electric force & charge' },
  { id:'current',  label:'Electric Current',     icon:'🔌', desc:'I = q/t, conductors' },
  { id:'voltage',  label:'Voltage & Resistance', icon:'🔋', desc:"Ohm's Law, V = IR" },
  { id:'circuits', label:'Circuits',             icon:'🔆', desc:'Series & parallel' },
  { id:'energy',   label:'Electrical Energy',    icon:'💡', desc:'Power, Joule effect' },
  { id:'waves',    label:'Waves & Oscillations', icon:'〰️', desc:'Period, frequency, wave types' },
];

const QBANK = [
  // ── COULOMB'S LAW ──────────────────────────────────────────────
  {
    id:'c1', topic:'coulomb', type:'mc',
    question:'What happens between two opposite (unlike) electric charges?',
    options:['They repel each other','They attract each other','Nothing happens','They become neutral'],
    answer:1,
    explanation:'Unlike charges attract each other. The electric force points <em>toward</em> the other charge when charges have opposite signs.',
    walkthrough:['Identify the charges: one positive (+), one negative (−).','Unlike charges → the force direction is <em>attractive</em> (toward each other).','"Like charges repel, unlike charges attract" — this is the basic rule of electrostatics.'],
  },
  {
    id:'c2', topic:'coulomb', type:'mc',
    question:'Which formula correctly represents Coulomb\'s Law?',
    options:['F = K·(q₁·q₂) / r','F = K·(q₁·q₂) / r²','F = q₁·q₂·r² / K','F = K / (q₁·q₂·r²)'],
    answer:1,
    explanation:'Coulomb\'s Law: <strong>F = K·(q₁·q₂) / r²</strong>. The force is inversely proportional to the <em>square</em> of the distance.',
    walkthrough:['The force depends on the product of both charges in the numerator.','It is inversely proportional to r² (not r).','K = 9×10⁹ N·m²/C² is Coulomb\'s constant.'],
  },
  {
    id:'c3', topic:'coulomb', type:'calc',
    question:'Two charges q₁ = 2×10⁻⁶ C and q₂ = 3×10⁻⁶ C are placed 0.1 m apart. Calculate the electric force between them. (K = 9×10⁹ N·m²/C²)',
    formula:'F = K·(q₁·q₂) / r²',
    answer:'5.4',
    unit:'N',
    tolerance:0.1,
    explanation:'F = 9×10⁹ × (2×10⁻⁶ × 3×10⁻⁶) / (0.1)² = 9×10⁹ × 6×10⁻¹² / 0.01 = <strong>5.4 N</strong>',
    walkthrough:['Write the formula: F = K·(q₁·q₂) / r².','Substitute: K=9×10⁹, q₁=2×10⁻⁶, q₂=3×10⁻⁶, r=0.1.','Numerator: 9×10⁹ × 6×10⁻¹² = 54×10⁻³ = 0.054.','Denominator: (0.1)² = 0.01.','F = 0.054 / 0.01 = 5.4 N.'],
  },
  {
    id:'c4', topic:'coulomb', type:'tf',
    question:'Two charges of the same sign will attract each other.',
    answer:false,
    explanation:'FALSE. Charges with the same sign (both + or both −) <strong>repel</strong> each other.',
    walkthrough:['Same sign → like charges → repulsion.','Different signs → unlike charges → attraction.'],
  },
  {
    id:'c5', topic:'coulomb', type:'calc',
    question:'What is the electric force when two charges of 4×10⁻⁶ C each are 0.2 m apart? (K = 9×10⁹ N·m²/C²)',
    formula:'F = K·(q₁·q₂) / r²',
    answer:'3.6',
    unit:'N',
    tolerance:0.1,
    explanation:'F = 9×10⁹ × (4×10⁻⁶)² / (0.2)² = 9×10⁹ × 16×10⁻¹² / 0.04 = 0.144/0.04 = <strong>3.6 N</strong>',
    walkthrough:['F = K·(q₁·q₂)/r². Both charges = 4×10⁻⁶ C.','q₁·q₂ = (4×10⁻⁶)² = 16×10⁻¹².','r² = (0.2)² = 0.04.','F = 9×10⁹ × 16×10⁻¹² / 0.04 = 144×10⁻³ / 0.04 = 3.6 N.'],
  },

  // ── ELECTRIC CURRENT ──────────────────────────────────────────
  {
    id:'i1', topic:'current', type:'mc',
    question:'The SI unit of electric current is:',
    options:['Volt','Ohm','Joule','Ampere'],
    answer:3,
    explanation:'The SI unit of electric current intensity is the <strong>Ampere (A)</strong>. Volt is voltage, Ohm is resistance, Joule is energy.',
    walkthrough:['Current I is measured in Ampere (A).','1 A = 1 C/s (one coulomb of charge per second).','Remember the formula: I = q/t.'],
  },
  {
    id:'i2', topic:'current', type:'mc',
    question:'Which material allows electric current to pass through it easily?',
    options:['Plastic','Rubber','Glass','Copper'],
    answer:3,
    explanation:'<strong>Copper</strong> is a conductor — it allows free movement of electrons. Plastic, rubber, and glass are insulators.',
    walkthrough:['Conductors have free electrons that can move.','Metals like copper, aluminium, silver are conductors.','Plastic, rubber, glass, wood are insulators.'],
  },
  {
    id:'i3', topic:'current', type:'mc',
    question:'An ammeter is connected:',
    options:['In parallel','In series','Outside the circuit','Across the battery only'],
    answer:1,
    explanation:'An ammeter is connected <strong>in series</strong> so that all the current flows through it. A voltmeter is connected in parallel.',
    walkthrough:['To measure current, the device must be in the current path → series.','If connected in parallel, most current would bypass it → wrong reading.','Voltmeter: parallel. Ammeter: series. Remember this pair!'],
  },
  {
    id:'i4', topic:'current', type:'calc',
    question:'A current of 3 A flows through a wire for 5 seconds. How much charge passes through the wire?',
    formula:'q = I × t',
    answer:'15',
    unit:'C',
    tolerance:0,
    explanation:'q = I × t = 3 A × 5 s = <strong>15 C</strong>',
    walkthrough:['Formula: I = q/t, rearranged: q = I × t.','Substitute: I = 3 A, t = 5 s.','q = 3 × 5 = 15 C.'],
  },
  {
    id:'i5', topic:'current', type:'calc',
    question:'How long does it take for 60 C of charge to pass if the current is 4 A?',
    formula:'t = q / I',
    answer:'15',
    unit:'s',
    tolerance:0,
    explanation:'t = q / I = 60 / 4 = <strong>15 s</strong>',
    walkthrough:['Formula: I = q/t → rearranged: t = q/I.','Substitute: q = 60 C, I = 4 A.','t = 60 / 4 = 15 s.'],
  },
  {
    id:'i6', topic:'current', type:'tf',
    question:'The conventional direction of current is from the negative pole to the positive pole.',
    answer:false,
    explanation:'FALSE. The <strong>conventional</strong> direction is from <strong>positive to negative</strong>. Electrons actually travel the opposite way (negative to positive).',
    walkthrough:['Conventional current: positive → negative (historically assumed positive charge moves).','Real electron flow: negative → positive.','Always distinguish between conventional and electron flow directions.'],
  },
  {
    id:'i7', topic:'current', type:'sa',
    question:'What is electric current? Include what it is made of and give its formula.',
    keywords:['oriented movement','electrons','charged particles','q','t','I = q/t'],
    answer:'Electric current is the oriented movement of electrons (or charged particles). Formula: I = q/t, where I is current in Amperes, q is charge in Coulombs, and t is time in seconds.',
    explanation:'Electric current is the <strong>oriented movement of electrons</strong> (or generally of charged particles). I = q/t.',
    walkthrough:['Define: current = oriented (directed) movement of charged particles.','The particles are usually electrons in metal conductors.','Formula: I = q/t — current equals charge divided by time.','Unit: Ampere (A).'],
  },

  // ── VOLTAGE & RESISTANCE ─────────────────────────────────────
  {
    id:'v1', topic:'voltage', type:'mc',
    question:'According to Ohm\'s Law, which formula is correct?',
    options:['V = R/I','V = R × I','I = V × R','R = V × I'],
    answer:1,
    explanation:'Ohm\'s Law: <strong>V = R × I</strong> (or I = V/R or R = V/I). Voltage = Resistance × Current.',
    walkthrough:["Ohm's Law: V = R·I.", 'Rearrangements: I = V/R and R = V/I.','The current is directly proportional to voltage (for constant R).'],
  },
  {
    id:'v2', topic:'voltage', type:'calc',
    question:'A resistor has a voltage of 12 V across it and a current of 3 A through it. Find its resistance.',
    formula:'R = V / I',
    answer:'4',
    unit:'Ω',
    tolerance:0,
    explanation:'R = V / I = 12 / 3 = <strong>4 Ω</strong>',
    walkthrough:['Formula: R = V / I.','Substitute: V = 12 V, I = 3 A.','R = 12 / 3 = 4 Ω.'],
  },
  {
    id:'v3', topic:'voltage', type:'calc',
    question:'What current flows through a 20 Ω resistor connected to a 100 V supply?',
    formula:'I = V / R',
    answer:'5',
    unit:'A',
    tolerance:0,
    explanation:'I = V / R = 100 / 20 = <strong>5 A</strong>',
    walkthrough:["Use Ohm's Law: I = V/R.",'Substitute: V = 100 V, R = 20 Ω.','I = 100 / 20 = 5 A.'],
  },
  {
    id:'v4', topic:'voltage', type:'mc',
    question:'A voltmeter is connected:',
    options:['In series with the component','In parallel with the component','Between the battery terminals only','Anywhere in the circuit'],
    answer:1,
    explanation:'A voltmeter is always connected <strong>in parallel</strong> across the component whose voltage is being measured.',
    walkthrough:['Voltmeter measures potential difference → must be across the component.','Parallel connection = same two nodes → same voltage.','Ammeter is in series; Voltmeter is in parallel. Learn this pair!'],
  },
  {
    id:'v5', topic:'voltage', type:'sa',
    question:'State Ohm\'s Law in words and write its formula.',
    keywords:['current','proportional','voltage','constant','V = RI','I = V/R'],
    answer:'For metal conductors, the current I is directly proportional to the voltage V, provided the resistance R remains constant. V = R·I (or I = V/R).',
    explanation:'For metal conductors, current is directly proportional to voltage (at constant temperature/resistance). V = R·I.',
    walkthrough:['Key phrase: "directly proportional" — doubling V doubles I.','Condition: resistance must be constant (metallic conductor).','Formula: V = RI or equivalently I = V/R.'],
  },

  // ── CIRCUITS ─────────────────────────────────────────────────
  {
    id:'ci1', topic:'circuits', type:'mc',
    question:'In a series circuit, which statement is true?',
    options:['Voltage is the same across all resistors','Current is the same through all resistors','Current splits at each resistor','Resistance decreases as more resistors are added'],
    answer:1,
    explanation:'In a <strong>series</strong> circuit: the current is the same through all components (I_total = I₁ = I₂), but voltage is shared.',
    walkthrough:['Series = single path for current → same current everywhere.','Voltage is shared: V_total = V₁ + V₂.','Resistance increases: R_total = R₁ + R₂.'],
  },
  {

// ── TOPIC SCREEN ──────────────────────────────────────────────────────────────
function buildTopicGrid() {
  const grid = document.getElementById('topic-grid');
  TOPICS.forEach(t => {
    const card = document.createElement('div');
    card.className = 'topic-card';
    card.dataset.id = t.id;
    card.innerHTML = `<div class="icon">${t.icon}</div><h3>${t.label}</h3><p>${t.desc}</p>`;
    card.onclick = () => {
      card.classList.toggle('selected');
      updateStartBtn();
    };
    grid.appendChild(card);
  });
}

function updateStartBtn() {
  const selected = document.querySelectorAll('.topic-card.selected');
  document.getElementById('start-btn').disabled = selected.length === 0;
}

function startQuiz() {
  const selected = [...document.querySelectorAll('.topic-card.selected')].map(c => c.dataset.id);
  const qs = QBANK.filter(q => selected.includes(q.topic));
  // shuffle
  state.queue = qs.sort(() => Math.random() - .5);
  state.idx = 0; state.correct = 0; state.wrong = 0;
  state.awaitingSimilar = false; state.currentSimilar = null;
  document.getElementById('topic-screen').style.display = 'none';
  document.getElementById('quiz-screen').style.display = 'block';
  renderQuestion();
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function renderQuestion() {
  if (state.idx >= state.queue.length) { showResults(); return; }
  updateHeader();
  updateProgress();
  const q = state.awaitingSimilar ? state.currentSimilar : state.queue[state.idx];
  const area = document.getElementById('question-area');
  area.innerHTML = '';

  const card = document.createElement('div');
  card.className = 'card';

  // meta row
  const topicInfo = TOPICS.find(t => t.id === (q.topicId || state.queue[state.idx].topic));
  const typeLabels = { mc:'Multiple Choice', sa:'Short Answer', calc:'Calculation', tf:'True / False', chal:'Challenge' };
  const typeBadges = { mc:'badge-mc', sa:'badge-sa', calc:'badge-calc', tf:'badge-tf', chal:'badge-chal' };
  card.innerHTML = `
    <div class="q-meta">
      <span class="badge ${typeBadges[q.type] || 'badge-mc'}">${typeLabels[q.type] || q.type}</span>
      ${topicInfo ? `<span class="topic-tag">${topicInfo.icon} ${topicInfo.label}</span>` : ''}
    </div>
    <div class="q-text">${q.question}</div>
    ${q.formula ? `<div class="formula-hint"><strong>Formula hint</strong>${q.formula}</div>` : ''}
    <div id="input-area"></div>
    <div id="feedback-area"></div>
  `;

  if (state.awaitingSimilar) {
    const lbl = document.createElement('div');
    lbl.className = 'similar-label';
    lbl.textContent = '⟳ Similar question — try again!';
    card.insertBefore(lbl, card.querySelector('.q-meta'));
  }

  area.appendChild(card);

  const inputArea = document.getElementById('input-area');
  if (q.type === 'mc') renderMC(q, inputArea);
  else if (q.type === 'tf') renderTF(q, inputArea);
  else if (q.type === 'calc') renderCalc(q, inputArea);
  else if (q.type === 'sa') renderSA(q, inputArea);
}

function renderMC(q, container) {
  const letters = ['A','B','C','D'];
  const div = document.createElement('div'); div.className = 'options';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="opt-letter">${letters[i]}</span><span>${opt}</span>`;
    btn.onclick = () => checkMC(q, i, div);
    div.appendChild(btn);
  });
  container.appendChild(div);
}

function checkMC(q, chosen, container) {
  const btns = container.querySelectorAll('.option-btn');
  btns.forEach(b => b.disabled = true);
  const correct = chosen === q.answer;
  btns[chosen].classList.add(correct ? 'correct' : 'wrong');
  if (!correct) btns[q.answer].classList.add('correct');
  showFeedback(q, correct);
}

function renderTF(q, container) {
  const row = document.createElement('div'); row.className = 'tf-row';
  ['True','False'].forEach((label, i) => {
    const btn = document.createElement('button');
    btn.className = 'tf-btn';
    btn.textContent = label;
    btn.onclick = () => {
      row.querySelectorAll('.tf-btn').forEach(b => b.disabled = true);
      const chosen = (i === 0);
      const correct = (chosen === q.answer);
      btn.classList.add(correct ? 'correct' : 'wrong');
      if (!correct) {
        row.querySelectorAll('.tf-btn').forEach(b => {
          if ((b.textContent === 'True' && q.answer === true) ||
              (b.textContent === 'False' && q.answer === false)) b.classList.add('correct');
        });
      }
      showFeedback(q, correct);
    };
    row.appendChild(btn);
  });
  container.appendChild(row);
}

function renderCalc(q, container) {
  const wrap = document.createElement('div'); wrap.className = 'text-input-wrap';
  const inp = document.createElement('textarea');
  inp.className = 'answer-input calc-input';
  inp.placeholder = `Your answer (in ${q.unit})…`;
  inp.rows = 1;
  const btn = document.createElement('button');
  btn.className = 'submit-btn'; btn.textContent = 'Check Answer';
  btn.onclick = () => {
    const raw = inp.value.trim().replace(',','.');
    const num = parseFloat(raw);
    const correct = Math.abs(num - parseFloat(q.answer)) <= (q.tolerance || 0);
    inp.disabled = true; btn.disabled = true;
    showFeedback(q, correct);
  };
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); btn.click(); } });
  wrap.appendChild(inp); wrap.appendChild(btn);
  container.appendChild(wrap);
}

function renderSA(q, container) {
  const wrap = document.createElement('div'); wrap.className = 'text-input-wrap';
  const inp = document.createElement('textarea');
  inp.className = 'answer-input';
  inp.placeholder = 'Write your answer…';
  const btn = document.createElement('button');
  btn.className = 'submit-btn'; btn.textContent = 'Check Answer';
  btn.onclick = () => {
    const val = inp.value.trim().toLowerCase();
    const hits = q.keywords.filter(k => val.includes(k.toLowerCase()));
    const correct = hits.length >= Math.ceil(q.keywords.length * 0.5);
    inp.disabled = true; btn.disabled = true;
    showFeedback(q, correct, hits);
  };
  wrap.appendChild(inp); wrap.appendChild(btn);
  container.appendChild(wrap);
}

// ── FEEDBACK ──────────────────────────────────────────────────────────────────
function showFeedback(q, correct, hits) {
  if (correct) state.correct++; else state.wrong++;
  updateHeader();

  const area = document.getElementById('feedback-area');
  const fb = document.createElement('div');
  fb.className = `feedback ${correct ? 'correct-fb' : 'wrong-fb'}`;

  if (correct) {
    fb.innerHTML = `<div class="feedback-title">Correct! ✓</div><p>${q.explanation}</p>`;
  } else {
    let wtHtml = '';
    if (q.walkthrough && q.walkthrough.length) {
      wtHtml = `<div class="walkthrough">
        <strong>Step-by-step walkthrough</strong>
        <ol>${q.walkthrough.map(s => `<li>${s}</li>`).join('')}</ol>
      </div>`;
    }
    if (q.type === 'sa' && hits) {
      fb.innerHTML = `<div class="feedback-title">Not quite. ✗</div>
        <p>You mentioned ${hits.length}/${q.keywords.length} key concepts.</p>
        <p><strong>Model answer:</strong> ${q.answer}</p>
        <p>${q.explanation}</p>${wtHtml}`;
    } else {
      fb.innerHTML = `<div class="feedback-title">Incorrect. ✗</div>
        <p><strong>Correct answer:</strong> ${getCorrectAnswerText(q)}</p>
        <p>${q.explanation}</p>${wtHtml}`;
    }
  }

  // Next / retry button
  const nextBtn = document.createElement('button');
  nextBtn.className = 'next-btn';
  const hasNext = state.idx + 1 < state.queue.length;

  if (!correct && SIMILAR[state.queue[state.idx]?.id] && !state.awaitingSimilar) {
    nextBtn.textContent = 'Try a Similar Question →';
    nextBtn.onclick = () => loadSimilar();
  } else {
    nextBtn.textContent = state.idx + 1 >= state.queue.length ? 'See Results' : 'Next Question →';
    nextBtn.onclick = () => advance();
  }

  fb.appendChild(nextBtn);
  area.appendChild(fb);
}

function getCorrectAnswerText(q) {
  if (q.type === 'mc') return q.options[q.answer];
  if (q.type === 'tf') return q.answer ? 'True' : 'False';
  if (q.type === 'calc') return `${q.answer} ${q.unit}`;
  return q.answer;
}

function loadSimilar() {
  const origId = state.queue[state.idx].id;
  const sim = SIMILAR[origId];
  state.awaitingSimilar = true;
  state.currentSimilar = { ...sim, topicId: state.queue[state.idx].topic };
  renderQuestion();
}

function advance() {
  state.awaitingSimilar = false;
  state.currentSimilar = null;
  state.idx++;
  renderQuestion();
}

// ── PROGRESS / HEADER ─────────────────────────────────────────────────────────
function updateHeader() {
  document.getElementById('hdr-correct').textContent = state.correct;
  document.getElementById('hdr-wrong').textContent = state.wrong;
  document.getElementById('hdr-qnum').textContent = state.idx + 1;
}

function updateProgress() {
  const pct = state.queue.length ? (state.idx / state.queue.length) * 100 : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-label').textContent = `${state.idx + 1} / ${state.queue.length}`;
}

// ── RESULTS ───────────────────────────────────────────────────────────────────
function showResults() {
  document.getElementById('quiz-screen').style.display = 'none';
  document.getElementById('results-screen').style.display = 'block';
  const total = state.correct + state.wrong;
  const pct = total ? Math.round((state.correct / total) * 100) : 0;
  document.getElementById('res-score').textContent = state.correct;
  document.getElementById('res-total').textContent = total;
  document.getElementById('res-correct').textContent = state.correct;
  document.getElementById('res-wrong').textContent = state.wrong;
  document.getElementById('res-pct').textContent = pct + '%';
  const msgs = [
    [90, 'Outstanding! You\'ve mastered this material.'],
    [75, 'Great job! Just a few areas to review.'],
    [50, 'Good effort — review the walkthroughs and try again.'],
    [0,  'Keep studying! Work through the walkthroughs carefully.'],
  ];
  document.getElementById('res-message').textContent = msgs.find(([t]) => pct >= t)[1];
}

// ── INIT ──────────────────────────────────────────────────────────────────────
buildTopicGrid();
</script>
